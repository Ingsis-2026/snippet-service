spring:
  application:
    name: snippet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:snippet}
    username: ${DB_USER:snippet}
    password: ${DB_PASSWORD:snippet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  # Las colas de snippets a lintear (US15) y a formatear (US12) son streams de Redis.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

services:
  permission-url: ${PERMISSION_URL:http://localhost:8081}
  language-url: ${LANGUAGE_URL:http://localhost:8082}
  # El código de los snippets lo guarda asset-service, que lo pone en Azurite.
  asset-url: ${ASSET_URL:http://localhost:8083}

# El container de asset-service donde va el código, un asset por snippet.
storage:
  container: ${ASSET_CONTAINER:snippets}

# Cada réplica lee los streams con su propio nombre de consumer: en Docker, HOSTNAME es el id del container.
streams:
  consumer: ${HOSTNAME:snippet-service}

management:
  endpoints:
    web:
      exposure:
        include: health
